# Render Blueprint: web-сервис + внешняя БД (Neon / Supabase).
# DATABASE_URL, ADMIN_USER, ADMIN_PASSWORD, SESSION_SECRET задаются вручную в Dashboard.
services:
  - type: web
    name: archimag-code
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
